name: Serpiente de contribuciones

on:
  schedule:
    # Se regenera cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generar la animacion
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6ad7ff&color_dots=#ebedf0,#c6d9f5,#8db4ef,#4b8fe8,#b48cff
            dist/github-snake-dark.svg?color_snake=#f6d36b&color_dots=#0a0c1a,#1b2450,#2f4a9e,#6ad7ff,#b48cff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
